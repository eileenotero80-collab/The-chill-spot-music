<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17112e"><title>The Chill Spot • Picture Puzzle Mini</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#120d27}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#443073,#120d27 75%);min-height:100dvh}button,select{font:inherit}button{cursor:pointer;border:1px solid #a18acb;background:#49327a;color:white;border-radius:12px;padding:12px;font-weight:700}button.primary{background:#f3c968;color:#241633;border-color:#f3c968}button:disabled{opacity:.4}button:focus-visible{outline:3px solid #fff}.app{max-width:950px;margin:auto;padding:16px}.top{text-align:center}.top h1{margin:3px;font-size:clamp(21px,4vw,34px);color:#ffdf87}.muted{color:#d0c5e4;font-size:13px}.toolbar,.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.toolbar>*{flex:1 1 130px}.controls>*{flex:1 1 145px}.screen{background:#24183e;border:2px solid #7057a1;border-radius:22px;min-height:300px;padding:22px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center}.category{background:#7554b2;border-radius:12px;padding:8px 18px;font-size:clamp(14px,2.5vw,20px);font-weight:800}.puzzle{font-size:clamp(38px,8vw,78px);font-weight:900;letter-spacing:1px;line-height:1.15;white-space:pre-line}.puzzle.small{font-size:clamp(29px,6vw,60px)}.hint,.answer,.story{border-radius:14px;background:#40305e;padding:12px;text-align:center;max-width:750px;margin:8px auto}.answer{color:#ffe28c;font-size:23px;font-weight:800}.story{line-height:1.5}.story strong{color:#ffe28c}.host{max-width:950px;margin:auto}.hostnote{font-size:12px;color:#bfb2d9;text-align:center}.hidden{display:none!important}
body.camera .top,body.camera .toolbar{display:none}body.camera .app{max-width:none;padding:8px}body.camera .screen{min-height:65dvh}body.camera .controls{position:sticky;bottom:0;background:#17112ef5;padding:8px;border-radius:12px}body.banner .top,body.banner .toolbar{display:none}body.banner .app{max-width:none;padding:8px}body.banner .screen{min-height:0;height:min(27vw,240px);border-radius:10px;padding:10px;gap:5px}body.banner .category{font-size:clamp(13px,2.5vw,23px);padding:4px 12px}body.banner .puzzle{font-size:clamp(32px,6vw,70px)}body.banner .puzzle.small{font-size:clamp(26px,4.5vw,52px)}body.banner .screen .hint,body.banner .screen .answer,body.banner .screen .story{display:none}body.banner .controls{margin-top:15px}body.banner .host{background:#281e43;border-radius:12px;padding:12px}body.banner .hostnote{margin:5px}.rebus{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05}.rebus span{display:block}.line{height:3px;width:100%;background:#fff;margin:4px 0}body.banner .rebus .line{height:2px}
@media(max-width:550px){button{padding:10px 6px;font-size:13px}body.banner .screen{height:30vw;min-height:125px}.controls>*{flex:1 1 110px}}
</style></head><body><main class="app"><header class="top"><div class="muted">THE CHILL SPOT</div><h1>🧩 Picture Puzzle Challenge</h1><div class="muted">12-puzzle trial • three styles • no repeats until you choose</div></header><nav class="toolbar"><button onclick="mode('normal')">Regular View</button><button onclick="mode('camera')">📷 Camera Mode</button><button onclick="mode('banner')">▭ Panel Banner</button><button onclick="togglePlayed()">✓ <span id="filterLabel">Unplayed Only: Off</span></button></nav><section class="screen" id="screen"><div class="category" id="cat"></div><div id="puzzle" class="puzzle"></div><div id="hint" class="hint hidden"></div><div id="answer" class="answer hidden"></div><div id="story" class="story hidden"></div></section><div class="hostnote" id="modeNote"></div><section class="host" id="host"><div id="hostReveal"></div><div class="controls"><button onclick="showHint()" id="hintBtn">Reveal Hint</button><button class="primary" onclick="showAnswer()" id="answerBtn">Reveal Answer</button><button onclick="showStory()" id="storyBtn">The Story Behind It</button><button onclick="prev()">◀ Previous</button><button class="primary" onclick="next()">Next ▶</button><button onclick="surprise()">🎲 Surprise Me</button><button onclick="markPlayed()" id="playedBtn">Mark Played</button><button onclick="mode('normal')">Exit Display Mode</button></div><div class="muted" id="progress" style="text-align:center"></div></section></main><script>
const puzzles=[
{cat:"WORD + PICTURE",clue:"🌧️ + 🎀",answer:"Rainbow",hint:"A colorful sight after a storm.",story:"A rainbow forms when sunlight is refracted, reflected, and dispersed by water droplets. The bow shape comes from the geometry of the light reaching your eyes."},
{cat:"OLD-SCHOOL REBUS",clue:"HEAD\n────────\nHEELS",answer:"Head over heels",hint:"A phrase for being deeply in love.",story:"The expression 'head over heels' has been used for centuries to describe tumbling or being completely carried away."},
{cat:"GUESS THE SONG",clue:"🧊 + 🧊 + 👶",answer:"Ice Ice Baby — Vanilla Ice",hint:"A 1990 hip-hop hit.",story:"Released in 1990, 'Ice Ice Baby' became the first hip-hop single to top the Billboard Hot 100."},
{cat:"GUESS THE MOVIE",clue:"🦁 + 👑",answer:"The Lion King",hint:"An animated story about a young prince.",story:"Disney's 1994 animated film features original songs by Elton John and Tim Rice, with a score by Hans Zimmer."},
{cat:"WORD + PICTURE",clue:"🔑 + ⌨️",answer:"Keyboard",hint:"You type on it.",story:"The familiar QWERTY letter arrangement dates back to 19th-century typewriters and is still widely used on modern devices."},
{cat:"OLD-SCHOOL REBUS",clue:"CYCLE   CYCLE   CYCLE",answer:"Tricycle",hint:"Think of how many times the word appears.",story:"The prefix 'tri-' means three. A tricycle is a three-wheeled vehicle, often associated with childhood."},
{cat:"GUESS THE TV SHOW",clue:"🥇 + 👩👩👩👩",answer:"The Golden Girls",hint:"Four friends share a home in Miami.",story:"The sitcom ran from 1985 to 1992 and centered on Dorothy, Rose, Blanche, and Sophia."},
{cat:"FAMOUS SAYING",clue:"⏰ + = + 💵",answer:"Time is money",hint:"A saying about the value of time.",story:"Benjamin Franklin popularized the expression in his 1748 essay 'Advice to a Young Tradesman.'"},
{cat:"OLD-SCHOOL REBUS",clue:"SIDE     SIDE",answer:"Side by side",hint:"Two identical words next to each other.",story:"Rebus puzzles use the position, repetition, and size of words as part of the clue—not just the words themselves."},
{cat:"GUESS THE ARTIST",clue:"🐝 + ON + 🌊",answer:"Beyoncé",hint:"Say the pictures and word aloud.",story:"Beyoncé first became widely known as a member of Destiny's Child before building a major solo career."},
{cat:"WORD + PICTURE",clue:"☀️ + 👓",answer:"Sunglasses",hint:"Something you wear outside.",story:"Sunglasses can reduce glare, and lenses labeled UV400 are designed to block nearly all UVA and UVB rays."},
{cat:"GUESS THE MOVIE",clue:"⭐ + ⚔️",answer:"Star Wars",hint:"A famous space adventure franchise.",story:"The first Star Wars film premiered in 1977 and was later subtitled 'Episode IV – A New Hope.'"}
];
let i=0,h=false,a=false,s=false,filter=false,view='normal';let played=new Set();try{played=new Set(JSON.parse(localStorage.getItem('chill-mini-played')||'[]'))}catch(e){}
const el=id=>document.getElementById(id);
function render(){let p=puzzles[i];el('cat').textContent=p.cat;el('puzzle').textContent=p.clue;el('puzzle').className='puzzle'+(p.clue.length>25?' small':'');el('hint').textContent='Hint: '+p.hint;el('answer').textContent=p.answer;el('story').innerHTML='<strong>THE STORY BEHIND IT</strong><div></div>';el('story').lastChild.textContent=p.story;el('hint').classList.toggle('hidden',!h||a);el('answer').classList.toggle('hidden',!a);el('story').classList.toggle('hidden',!s||!a);el('hintBtn').textContent=h?'Hide Hint':'Reveal Hint';el('answerBtn').textContent=a?'Hide Answer':'Reveal Answer';el('storyBtn').disabled=!a;el('storyBtn').textContent=s?'Hide Story':'The Story Behind It';el('playedBtn').textContent=played.has(i)?'✓ Played (undo)':'Mark Played';el('progress').textContent=`Puzzle ${i+1} of ${puzzles.length} • ${played.size} played`;let banner=view==='banner';el('hostReveal').innerHTML=banner&&a?'<div class="answer">Answer: '+p.answer+'</div>':banner&&h?'<div class="hint">Hint: '+p.hint+'</div>':'';if(banner&&s&&a){let div=document.createElement('div');div.className='story';div.textContent='The Story Behind It: '+p.story;el('hostReveal').appendChild(div)}el('modeNote').textContent=banner?'Panel Banner: only category and puzzle appear in the upper display. Host reveals stay below. Frame only the upper display with your phone.':view==='camera'?'Camera Mode: hint, answer, story and navigation work without leaving this view.':'';}
function reset(){h=a=s=false}function showHint(){h=!h;render()}function showAnswer(){a=!a;if(!a)s=false;render()}function showStory(){if(a)s=!s;render()}function next(){move(1)}function prev(){move(-1)}function move(d){let j=i;for(let k=0;k<puzzles.length;k++){j=(j+d+puzzles.length)%puzzles.length;if(!filter||!played.has(j)){i=j;reset();render();return}}alert('All 12 puzzles have been marked played. Turn off Unplayed Only to review them.')}function surprise(){let opts=puzzles.map((_,n)=>n).filter(n=>n!==i&&(!filter||!played.has(n)));if(!opts.length){alert('No other unplayed puzzles.');return}i=opts[Math.floor(Math.random()*opts.length)];reset();render()}function markPlayed(){played.has(i)?played.delete(i):played.add(i);try{localStorage.setItem('chill-mini-played',JSON.stringify([...played]))}catch(e){}render()}function togglePlayed(){filter=!filter;el('filterLabel').textContent='Unplayed Only: '+(filter?'On':'Off');render()}function mode(m){view=m;document.body.className=m==='normal'?'':m;render()}render();
</script></body></html>
