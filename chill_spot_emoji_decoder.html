<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111229"><title>The Chill Spot — Emoji Decoder</title><style>
*{box-sizing:border-box}body{margin:0;background:#101124;color:#fff;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:980px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;color:#d6c7ff;font-size:13px;font-weight:700;letter-spacing:1px}.stage{background:linear-gradient(155deg,#2b2156,#181b3d);border:2px solid #7457b8;border-radius:24px;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:25px;text-align:center;padding:25px;margin:14px 0;box-shadow:0 15px 50px #0006}h1{margin:0;font-size:clamp(25px,5vw,48px);color:#e9dcff}.category{font-size:clamp(17px,3vw,26px);font-weight:800;background:#6748a2;padding:12px 24px;border-radius:14px}.clue{font-size:clamp(46px,9vw,108px);font-weight:800;line-height:1.4;overflow-wrap:anywhere}.result{font-size:clamp(20px,3.8vw,36px);color:#ffdc80;font-weight:800}.detail{font-size:18px;color:#ddd9f1}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button,select{min-height:52px;border:0;border-radius:12px;font-size:17px;font-weight:700;padding:12px;color:white;background:#6748a2}button:active{transform:scale(.98)}button.secondary{background:#343852}select{width:100%;margin-bottom:10px;background:#343852}button:focus-visible{outline:3px solid #ffdf83}.foot{font-size:13px;color:#b5b6ce;text-align:center;padding:12px}.camera .stage{min-height:calc(100dvh - 135px);margin:8px 0}.camera .hide-camera{display:none}.camera main{max-width:none}.camera .clue{font-size:clamp(54px,11vw,145px)}.camera .stage{border-width:3px}@media(min-width:700px){.controls{grid-template-columns:repeat(4,1fr)}}@media(orientation:landscape){.camera .stage{min-height:calc(100dvh - 105px);gap:12px}.camera .clue{font-size:clamp(42px,8vw,100px)}} 
</style></head><body><main><div class="top"><span>THE CHILL SPOT</span><span id="counter"></span></div><section class="stage" aria-live="polite"><h1>EMOJI DECODER</h1><div class="category" id="category"></div><div class="clue" id="clue"></div><div id="result" class="result"></div><div id="detail" class="detail"></div></section><div class="hide-camera"><select id="filter" aria-label="Choose category"><option value="All">All categories</option><option>Artist</option><option>Song</option><option>Movie</option><option>TV Show</option><option>Celebrity</option></select><div class="controls"><button id="hint">Reveal Hint</button><button id="answer">Reveal Answer</button><button id="prev" class="secondary">← Previous</button><button id="next">Next Puzzle →</button><button id="random" class="secondary">Surprise Me</button><button id="camera">📷 Camera Mode</button></div></div><div id="cameraControls" style="display:none" class="controls"><button id="camPrev" class="secondary">← Previous</button><button id="camNext">Next →</button><button id="camReveal">Reveal Answer</button><button id="exitCamera" class="secondary">Exit Camera Mode</button></div><div class="foot hide-camera">Offline-friendly • Answers hidden until you reveal • Camera Mode enlarges the puzzle</div></main><script>
const puzzles=[{"category": "Artist", "clue": "🐝 + ON + 🌊", "answer": "Beyoncé", "hint": "Her name sounds like the three clues", "explanation": "Bee + on + sea"}, {"category": "Song", "clue": "🧊 + 🧊 + 👶", "answer": "Ice Ice Baby", "hint": "A 1990 rap hit", "explanation": "Ice + ice + baby"}, {"category": "Movie", "clue": "🕷️ + 👨", "answer": "Spider-Man", "hint": "A superhero", "explanation": "Spider + man"}, {"category": "Movie", "clue": "🦁 + 👑", "answer": "The Lion King", "hint": "Disney animation", "explanation": "Lion + king"}, {"category": "Song", "clue": "💜 + 🌧️", "answer": "Purple Rain", "hint": "A Prince classic", "explanation": "Purple + rain"}, {"category": "Movie", "clue": "⚫ + 🐆", "answer": "Black Panther", "hint": "A Marvel movie", "explanation": "Black + panther"}, {"category": "Song", "clue": "🍬 + 👧", "answer": "Candy Girl", "hint": "New Edition", "explanation": "Candy + girl"}, {"category": "Movie", "clue": "🥋 + 🐼", "answer": "Kung Fu Panda", "hint": "Animated martial arts", "explanation": "Kung fu + panda"}, {"category": "Song", "clue": "👁️ + 🐯", "answer": "Eye of the Tiger", "hint": "Survivor's 1982 hit", "explanation": "Eye + tiger"}, {"category": "Song", "clue": "👧 + 🔥", "answer": "Girl on Fire", "hint": "Alicia Keys", "explanation": "Girl + fire"}, {"category": "Song", "clue": "☂️", "answer": "Umbrella", "hint": "Rihanna song", "explanation": "An umbrella"}, {"category": "Movie", "clue": "🏠 + 👦", "answer": "Home Alone", "hint": "Holiday comedy", "explanation": "Home + alone (boy by himself)"}, {"category": "Song", "clue": "🔥 + 💍", "answer": "Ring of Fire", "hint": "Johnny Cash", "explanation": "Fire + ring"}, {"category": "Celebrity", "clue": "🪨", "answer": "The Rock", "hint": "Actor and former wrestler", "explanation": "Rock"}, {"category": "Movie", "clue": "🚢 + 🧊", "answer": "Titanic", "hint": "1997 blockbuster", "explanation": "Ship + iceberg"}, {"category": "Movie", "clue": "🧸 + 📖", "answer": "Toy Story", "hint": "Pixar movie", "explanation": "Toy + story"}, {"category": "Movie", "clue": "⭐ + ⚔️", "answer": "Star Wars", "hint": "Space saga", "explanation": "Star + wars"}, {"category": "Song", "clue": "🖤 + 🪄 + 👩", "answer": "Black Magic Woman", "hint": "Santana hit", "explanation": "Black + magic + woman"}, {"category": "Movie", "clue": "🐀 + 👨‍🍳", "answer": "Ratatouille", "hint": "Animated cooking movie", "explanation": "Rat + chef"}, {"category": "Song", "clue": "🚶 + ☀️", "answer": "Walking on Sunshine", "hint": "Katrina and the Waves", "explanation": "Walking + sunshine"}, {"category": "Movie", "clue": "👑 + 🦍", "answer": "King Kong", "hint": "Giant ape movie", "explanation": "King + kong (ape)"}, {"category": "Movie", "clue": "🧊 + 👸", "answer": "Frozen", "hint": "Disney animation", "explanation": "Ice + princess"}, {"category": "Song", "clue": "💃 + 👑", "answer": "Dancing Queen", "hint": "ABBA hit", "explanation": "Dancing + queen"}, {"category": "TV Show", "clue": "👑 + ♟️", "answer": "The Queen's Gambit", "hint": "Chess drama", "explanation": "Queen + chess"}, {"category": "Movie", "clue": "🧙 + 🏫", "answer": "Harry Potter", "hint": "Wizard at a school", "explanation": "Wizard + school"}, {"category": "TV Show", "clue": "🧽 + 🟨 + 👖", "answer": "SpongeBob SquarePants", "hint": "Animated underwater comedy", "explanation": "Sponge + square + pants"}, {"category": "Song", "clue": "🛣️ + 🔥", "answer": "Highway to Hell", "hint": "AC/DC", "explanation": "Highway + hellfire"}, {"category": "Movie", "clue": "👸 + 🐸", "answer": "The Princess and the Frog", "hint": "Disney movie", "explanation": "Princess + frog"}];
let order=puzzles.map((_,i)=>i),pos=0,hint=false,revealed=false,camera=false;
const el=id=>document.getElementById(id);
function render(){const p=puzzles[order[pos]];el("counter").textContent=`${pos+1} / ${order.length}`;el("category").textContent="GUESS THE "+p.category.toUpperCase();el("clue").textContent=p.clue;el("result").textContent=revealed?p.answer:"";el("detail").textContent=revealed?p.explanation:hint?p.hint:"Can you crack the code?";el("hint").textContent=hint?"Hide Hint":"Reveal Hint";el("answer").textContent=revealed?"Hide Answer":"Reveal Answer";el("camReveal").textContent=revealed?"Hide Answer":"Reveal Answer";}
function move(n){pos=(pos+n+order.length)%order.length;hint=false;revealed=false;render()}
el("next").onclick=()=>move(1);el("prev").onclick=()=>move(-1);el("camNext").onclick=()=>move(1);el("camPrev").onclick=()=>move(-1);
el("hint").onclick=()=>{hint=!hint;render()};function toggleAnswer(){revealed=!revealed;render()}el("answer").onclick=toggleAnswer;el("camReveal").onclick=toggleAnswer;
el("filter").onchange=e=>{order=puzzles.map((p,i)=>i).filter(i=>e.target.value==="All"||puzzles[i].category===e.target.value);pos=0;hint=false;revealed=false;render()};
el("random").onclick=()=>{if(order.length>1){let n;do{n=Math.floor(Math.random()*order.length)}while(n===pos);pos=n}hint=false;revealed=false;render()};
function setCamera(v){camera=v;document.body.classList.toggle("camera",v);el("cameraControls").style.display=v?"grid":"none";if(v&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!v&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});render()}
el("camera").onclick=()=>setCamera(true);el("exitCamera").onclick=()=>setCamera(false);render();
</script></body></html>
